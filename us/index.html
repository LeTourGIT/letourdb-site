<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇺🇸 US Market Summary Archive · LeTourDB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root{--bg:#0b0e13;--surface:#111520;--surface2:#161b26;--surface3:#1c2130;
    --border:#222840;--border2:#2a3050;--text:#e4e8f2;--text-muted:#7a85a0;
    --text-dim:#424d68;--green:#22c55e;--green-bg:#091a10;--red:#ef4444;
    --amber:#f59e0b;--blue:#60a5fa;--blue-bg:#0a1628;--accent:#818cf8;--gold:#fbbf24;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
       min-height:100vh;font-size:14px;}
  ::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
  nav{background:var(--surface);border-bottom:1px solid var(--border2);
      padding:0 32px;display:flex;align-items:center;height:52px;gap:0;
      position:sticky;top:0;z-index:100;}
  .nav-logo{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;
            color:var(--text);letter-spacing:.04em;margin-right:32px;text-decoration:none;}
  .nav-logo span{color:var(--accent);}
  .nav-links{display:flex;gap:0;height:100%;}
  .nav-links a{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
               text-transform:uppercase;color:var(--text-muted);text-decoration:none;
               padding:0 16px;display:flex;align-items:center;
               border-bottom:2px solid transparent;transition:all .15s;}
  .nav-links a:hover{color:var(--text);}
  .nav-links a.active{color:var(--blue);border-bottom-color:var(--blue);}
  .hero{padding:32px;border-bottom:1px solid var(--border);
        background:linear-gradient(135deg,#0a1020 0%,#0b1428 100%);}
  .hero h1{font-family:'DM Mono',monospace;font-size:20px;font-weight:400;
            color:var(--blue);}
  .hero .sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);
             letter-spacing:.08em;margin-top:5px;}
  .container{max-width:1200px;margin:0 auto;padding:32px;}
  .search-bar{display:flex;gap:10px;margin-bottom:20px;}
  .search-input{flex:1;background:var(--surface2);border:1px solid var(--border2);
                border-radius:6px;padding:9px 14px;color:var(--text);
                font-family:'DM Mono',monospace;font-size:12px;outline:none;}
  .search-input:focus{border-color:var(--accent);}
  .search-input::placeholder{color:var(--text-dim);}
  .filter-select{background:var(--surface2);border:1px solid var(--border2);
                 border-radius:6px;padding:9px 12px;color:var(--text-muted);
                 font-family:'DM Mono',monospace;font-size:11px;outline:none;cursor:pointer;}
  .archive-table{width:100%;border-collapse:collapse;}
  .archive-table thead tr{border-bottom:1px solid var(--border2);}
  .archive-table th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;
                    text-transform:uppercase;color:var(--text-dim);padding:8px 10px;
                    text-align:left;font-weight:500;}
  .archive-table td{padding:11px 10px;border-bottom:1px solid var(--border);
                    font-size:12.5px;vertical-align:middle;}
  .archive-table tr:last-child td{border-bottom:none;}
  .archive-table tr:hover td{background:rgba(255,255,255,.02);}
  .col-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);white-space:nowrap;}
  .col-val{font-family:'DM Mono',monospace;font-size:13px;color:var(--text);}
  .up{color:var(--green);}.dn{color:var(--red);}
  .tag{font-family:'DM Mono',monospace;font-size:9.5px;padding:2px 8px;
       border-radius:3px;letter-spacing:.05em;border:1px solid;margin:1px;}
  .tag-athl{background:#091a10;color:var(--green);border-color:#166534;}
  .tag-warn{background:#1a1500;color:var(--amber);border-color:#713f12;}
  .tag-soft{background:#130f20;color:var(--accent);border-color:#3730a3;}
  .tag-neu{background:var(--surface3);color:var(--text-muted);border-color:var(--border2);}
  .tag-rba{background:#1a0e00;color:var(--amber);border-color:#7c3a00;}
  .col-tags{display:flex;flex-wrap:wrap;gap:3px;}
  .col-actions{display:flex;gap:6px;white-space:nowrap;}
  .btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.07em;
       text-transform:uppercase;padding:6px 12px;border-radius:5px;
       text-decoration:none;font-weight:500;transition:all .15s;display:inline-flex;
       align-items:center;gap:5px;}
  .btn-view{background:var(--blue-bg);color:var(--blue);border:1px solid #1e3a5f;}
  .btn-view:hover{background:#0d2040;}
  .btn-dl{background:var(--surface3);color:var(--text-dim);border:1px solid var(--border);}
  .btn-dl:hover{color:var(--text-muted);}
  .empty-state{text-align:center;padding:60px;font-family:'DM Mono',monospace;
               font-size:11px;color:var(--text-dim);letter-spacing:.06em;line-height:2;}
  footer{border-top:1px solid var(--border);padding:20px 32px;text-align:center;
         font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">LeTour<span>DB</span></a>
  <div class="nav-links">
    <a href="../index.html">Dashboard</a>
    <a href="index.html" class="active">🇺🇸 US Archive</a>
    <a href="../asx/index.html">🇦🇺 ASX Archive</a>
  </div>
</nav>

<div class="hero">
  <h1>🇺🇸 US Market Summary Archive</h1>
  <div class="sub">ALL REPORTS · CHRONOLOGICAL · NEWEST FIRST</div>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" class="search-input" id="search-input"
           placeholder="Search ticker, tag, date, keyword...">
    <select class="filter-select" id="tag-filter">
      <option value="">All Tags</option>
    </select>
  </div>

  <table class="archive-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>SPX</th>
        <th>Change</th>
        <th>NDX</th>
        <th>VIX</th>
        <th>Smart Money #1</th>
        <th>Tags</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="archive-body">
      <tr><td colspan="8">
        <div class="empty-state">No US reports yet.<br>Reports appear here after the first publish.</div>
      </td></tr>
    </tbody>
  </table>
</div>

<footer>LeTour Trader Dashboard · US Archive</footer>

<script>
let reports = [];
let allTags = new Set();

async function load() {
  try {
    const r = await fetch('../report-index.json');
    if (!r.ok) return;
    const all = await r.json();
    reports = all.filter(x => x.market === 'US')
                 .sort((a,b) => new Date(b.date_iso) - new Date(a.date_iso));
    reports.forEach(r => (r.tags||[]).forEach(t => allTags.add(t)));
    const sel = document.getElementById('tag-filter');
    [...allTags].sort().forEach(t => {
      const o = document.createElement('option');
      o.value = t; o.textContent = t; sel.appendChild(o);
    });
    render(reports);
  } catch(e) {}
}

function tagClass(tag) {
  const t = tag.toLowerCase();
  if (['ath','new high','record'].some(k=>t.includes(k))) return 'tag-athl';
  if (['fomc','rba','fed','rate'].some(k=>t.includes(k))) return 'tag-warn';
  if (['earnings'].some(k=>t.includes(k))) return 'tag-soft';
  if (['breadth','overbought'].some(k=>t.includes(k))) return 'tag-warn';
  if (['oil','hormuz','geo'].some(k=>t.includes(k))) return 'tag-rba';
  return 'tag-neu';
}

function render(data) {
  const tbody = document.getElementById('archive-body');
  if (!data.length) return;
  tbody.innerHTML = data.map(r => {
    const chgClass = parseFloat(r.index_change) >= 0 ? 'up' : 'dn';
    const tags = (r.tags||[]).map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join('');
    return `<tr data-tags="${(r.tags||[]).join(',').toLowerCase()}"
                data-date="${r.date}"
                data-summary="${(r.summary||'').toLowerCase()}">
      <td class="col-date">${r.date}</td>
      <td class="col-val">${r.index_close}</td>
      <td class="col-val ${chgClass}">${r.index_change}</td>
      <td class="col-val" style="font-size:11px;color:var(--text-muted)">${r.ndx_close||'—'}</td>
      <td class="col-val" style="font-size:11px;color:var(--text-muted)">${r.vix||'—'}</td>
      <td style="font-size:11px;color:var(--accent);font-family:'DM Mono',monospace">${r.smart_money_top||'—'}</td>
      <td class="col-tags">${tags}</td>
      <td class="col-actions">
        <a href="reports/${r.html_file}" class="btn btn-view" target="_blank">View</a>
        <a href="../downloads/Discord_FULL_US_${r.file_date}.txt" class="btn btn-dl" download>↓ Full</a>
        <a href="../downloads/Discord_CONDENSED_US_${r.file_date}.txt" class="btn btn-dl" download>↓ Cond</a>
      </td>
    </tr>`;
  }).join('');
}

function applyFilters() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const tag = document.getElementById('tag-filter').value.toLowerCase();
  document.querySelectorAll('#archive-body tr[data-tags]').forEach(row => {
    const text = row.dataset.tags+' '+row.dataset.date.toLowerCase()+' '+row.dataset.summary;
    const mQ = !q || text.includes(q);
    const mT = !tag || row.dataset.tags.includes(tag);
    row.style.display = (mQ && mT) ? '' : 'none';
  });
}

document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('tag-filter').addEventListener('change', applyFilters);
load();
</script>
</body>
</html>
