<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASX Market Summary Archive - LeTourDB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root{--bg:#0b0e13;--surface:#111520;--surface2:#161b26;--surface3:#1c2130;--border:#222840;--border2:#2a3050;--text:#e4e8f2;--text-muted:#7a85a0;--text-dim:#424d68;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#60a5fa;--accent:#818cf8;--au-gold:#c9a227;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
  ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
  nav{background:var(--surface);border-bottom:1px solid var(--border2);padding:0 32px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:100;}
  .nav-logo{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:var(--text);letter-spacing:.04em;margin-right:32px;text-decoration:none;}
  .nav-logo span{color:var(--accent);}
  .nav-links{display:flex;height:100%;}
  .nav-links a{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;padding:0 16px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:all .15s;}
  .nav-links a:hover{color:var(--text);}
  .nav-links a.active{color:var(--au-gold);border-bottom-color:var(--au-gold);}
  .hero{padding:32px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#0f1208,#131a08);}
  .hero h1{font-family:'DM Mono',monospace;font-size:20px;font-weight:400;color:var(--au-gold);}
  .hero .sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.08em;margin-top:5px;}
  .container{max-width:1200px;margin:0 auto;padding:32px;}
  .search-bar{display:flex;gap:10px;margin-bottom:20px;}
  .search-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:9px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none;}
  .search-input:focus{border-color:var(--accent);}
  .search-input::placeholder{color:var(--text-dim);}
  .filter-select{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:9px 12px;color:var(--text-muted);font-family:'DM Mono',monospace;font-size:11px;outline:none;cursor:pointer;}
  .archive-table{width:100%;border-collapse:collapse;}
  .archive-table thead tr{border-bottom:1px solid var(--border2);}
  .archive-table th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:8px 10px;text-align:left;font-weight:500;}
  .archive-table td{padding:11px 10px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle;}
  .archive-table tr:last-child td{border-bottom:none;}
  .archive-table tr:hover td{background:rgba(255,255,255,.02);}
  .col-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);white-space:nowrap;}
  .col-val{font-family:'DM Mono',monospace;font-size:13px;}
  .up{color:var(--green);}.dn{color:var(--red);}
  .tag{font-family:'DM Mono',monospace;font-size:9.5px;padding:2px 8px;border-radius:3px;letter-spacing:.05em;border:1px solid;margin:1px;}
  .tag-athl{background:#091a10;color:var(--green);border-color:#166534;}
  .tag-warn{background:#1a1500;color:var(--amber);border-color:#713f12;}
  .tag-soft{background:#130f20;color:var(--accent);border-color:#3730a3;}
  .tag-rba{background:#1a0e00;color:var(--amber);border-color:#7c3a00;}
  .tag-neu{background:var(--surface3);color:var(--text-muted);border-color:var(--border2);}
  .col-tags{display:flex;flex-wrap:wrap;gap:3px;}
  .col-actions{display:flex;gap:6px;white-space:nowrap;}
  .btn-view{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:4px;text-decoration:none;display:inline-flex;align-items:center;background:#1a1200;color:var(--au-gold);border:1px solid #7c5a00;}
  .btn-view:hover{background:#241800;}
  .btn-dl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:4px;text-decoration:none;display:inline-flex;align-items:center;background:var(--surface3);color:var(--text-dim);border:1px solid var(--border);}
  .btn-dl:hover{color:var(--text-muted);}
  .empty-state{text-align:center;padding:60px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim);line-height:2;}
  footer{border-top:1px solid var(--border);padding:20px 32px;text-align:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);}
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">LeTour<span>DB</span></a>
  <div class="nav-links">
    <a href="/index.html">Dashboard</a>
    <a href="/us/index.html">US Archive</a>
    <a href="/asx/index.html" class="active">ASX Archive</a>
    <a href="/qullamaggie/index.html">Qullamaggie Screens</a>
  </div>
</nav>

<div class="hero">
  <h1>ASX Market Summary Archive</h1>
  <div class="sub">ALL REPORTS &nbsp;·&nbsp; CHRONOLOGICAL &nbsp;·&nbsp; NEWEST FIRST</div>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="Search ticker, tag, date, keyword...">
    <select class="filter-select" id="tag-filter"><option value="">All Tags</option></select>
  </div>
  <table class="archive-table">
    <thead><tr><th>Date</th><th>XJO</th><th>Change</th><th>XAO</th><th>Regime</th><th>Smart Money #1</th><th>Tags</th><th>Actions</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="8"><div class="empty-state">No ASX reports yet.</div></td></tr></tbody>
  </table>
</div>

<footer>LeTour Trader Dashboard &nbsp;·&nbsp; ASX Archive</footer>

<script>
function tagCls(tag) {
  var t=(tag||'').toLowerCase();
  if (t.indexOf('ath')>=0||t.indexOf('high')>=0||t.indexOf('record')>=0) return 'tag-athl';
  if (t.indexOf('rba')>=0||t.indexOf('rate')>=0||t.indexOf('hike')>=0) return 'tag-rba';
  if (t.indexOf('earnings')>=0) return 'tag-soft';
  if (t.indexOf('breadth')>=0||t.indexOf('streak')>=0) return 'tag-warn';
  return 'tag-neu';
}
function tagsHtml(arr){return (arr||[]).map(function(t){return '<span class="tag '+tagCls(t)+'">'+t+'</span>';}).join('');}

fetch('/report-index.json')
  .then(function(r){return r.json();})
  .then(function(data){
    var reports=(data||[]).filter(function(r){return r.market==='ASX';}).sort(function(a,b){return new Date(b.date_iso)-new Date(a.date_iso);});
    var tagSet={};
    reports.forEach(function(r){(r.tags||[]).forEach(function(t){tagSet[t]=1;});});
    var sel=document.getElementById('tag-filter');
    Object.keys(tagSet).sort().forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});

    if (!reports.length) return;
    var rows=reports.map(function(r){
      var chg=parseFloat(r.index_change||0)>=0?'up':'dn';
      var tgs=tagsHtml(r.tags);
      var attr='data-tags="'+(r.tags||[]).join(',').toLowerCase()+'" data-date="'+(r.date||'').toLowerCase()+'" data-summary="'+(r.summary||'').toLowerCase()+'"';
      return '<tr '+attr+'>'+
        '<td class="col-date">'+r.date+'</td>'+
        '<td class="col-val">'+r.index_close+'</td>'+
        '<td class="col-val '+chg+'">'+r.index_change+'</td>'+
        '<td class="col-val" style="color:var(--text-muted)">'+(r.xao_close||'—')+'</td>'+
        '<td style="font-size:10px;color:var(--text-muted);font-family:\'DM Mono\',monospace">'+(r.regime||'—')+'</td>'+
        '<td style="font-size:11px;color:#c9a227;font-family:\'DM Mono\',monospace">'+(r.smart_money_top||'—')+'</td>'+
        '<td class="col-tags">'+tgs+'</td>'+
        '<td class="col-actions">'+
          '<a href="/asx/reports/'+r.html_file+'" class="btn-view" target="_blank">View</a>'+
          '<a href="/downloads/Discord_FULL_ASX_'+r.file_date+'.txt" class="btn-dl" download>&#8595; Full</a>'+
          '<a href="/downloads/Discord_CONDENSED_ASX_'+r.file_date+'.txt" class="btn-dl" download>&#8595; Cond</a>'+
        '</td>'+
      '</tr>';
    });
    document.getElementById('tbody').innerHTML=rows.join('');
  }).catch(function(){});

function filter(){
  var q=(document.getElementById('search-input').value||'').toLowerCase();
  var t=(document.getElementById('tag-filter').value||'').toLowerCase();
  document.querySelectorAll('#tbody tr[data-tags]').forEach(function(row){
    var txt=row.dataset.tags+' '+row.dataset.date+' '+row.dataset.summary;
    row.style.display=(!q||txt.indexOf(q)>=0)&&(!t||row.dataset.tags.indexOf(t)>=0)?'':'none';
  });
}
document.getElementById('search-input').addEventListener('input',filter);
document.getElementById('tag-filter').addEventListener('change',filter);
</script>
</body>
</html>
